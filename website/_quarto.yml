project:
  type: website
  output-dir: _site
  # Regenerates reference/*.qmd from the package's roxygen docs before every
  # render -- locally AND on Posit Connect Cloud. Single source of truth.
  pre-render: _generate_reference.R

website:
  title: "goAquaFlux"
  description: "Partitioning diffusive and ebullitive greenhouse-gas fluxes from aquatic floating chambers, an extension to goFlux."
  site-url: "https://connect.posit.cloud/"        # replace with your published URL
  repo-url: "https://github.com/Qepanna/goFlux/"  # replace with your fork
  repo-branch: aquaghg                            # replace with your branch
  repo-actions: [edit, issue]

  navbar:
    left:
      - href: index.qmd
        text: Home
      - text: "Articles"
        menu:
          - articles/getting-started.qmd
          - articles/bubble-detection.qmd
          - articles/partitioning-workflow.qmd
      - href: reference/index.qmd
        text: "Reference"
    right:
      - icon: github
        href: https://github.com/YOURUSER/goFlux
        aria-label: GitHub

  sidebar:
    - id: reference
      title: "Reference"
      contents:
        - reference/index.qmd
        - section: "Main entry point"
          contents:
            - reference/goAquaFlux.qmd
        - section: "Components"
          contents:
            - reference/find.bubbles.qmd
            - reference/goAquaFlux.diffusive.qmd
            - reference/goAquaFlux.ebullition.qmd
            - reference/goAquaFlux.total.qmd
        - section: "Visualisation"
          contents:
            - reference/flux.plot.aqua.qmd

format:
  html:
    theme: cosmo
    toc: true
    toc-depth: 3
    code-copy: true
    code-overflow: wrap
    css: styles.css

# Knitr is the right engine for an R package site.
engine: knitr

execute:
  freeze: auto     # cache results; re-run only when the source .qmd changes
  warning: false
  message: false
